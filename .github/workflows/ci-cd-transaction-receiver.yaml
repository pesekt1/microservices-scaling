name: Transaction receiver microservice - Build, Test, Push image to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "transaction-receiver/**" # Trigger if files in transaction-receiver/ folder change
      - ".github/workflows/ci-cd-transaction-receiver.yaml" # Trigger if this workflow file changes

  workflow_dispatch: # Allows you to manually run the workflow from the Actions tab

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # This is for winston logger to write logs to /var/log/transaction-receiver
      # We dont need logging for test but it would fail if the directory does not exist
      - name: Create log directory
        run: |
          sudo mkdir -p /var/log/transaction-receiver
          sudo chmod -R 777 /var/log/transaction-receiver

      - name: Install dependencies
        run: |
          cd transaction-receiver
          npm install

      - name: Run integration tests
        run: |
          cd transaction-receiver
          npx vitest run integration.test.ts

  system-tests:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # Started after RabbitMQ is healthy (service containers start in parallel, with no ordering)
      - name: Start fraud-detection
        run: |
          docker run -d --name fraud-detection \
            --network ${{ job.services.rabbitmq.network }} \
            -p 3003:3003 \
            -e PORT=3003 \
            -e RABBITMQ_URL=amqp://rabbitmq \
            -e INPUT_QUEUE_NAME=transactionPayloads \
            -e ACCEPTED_QUEUE_NAME=acceptedTransactions \
            -e SUSPICIOUS_QUEUE_NAME=suspiciousTransactions \
            pesekt1/fraud-detection:latest

      - name: Wait for fraud-detection
        run: curl -s -o /dev/null --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3003/

      - name: Capture fraud-detection logs
        if: failure()
        run: |
          docker ps -a
          docker logs fraud-detection

      # Winston logger in transaction-receiver writes to this directory and fails if it can't create it
      - name: Create log directory
        run: |
          sudo mkdir -p /var/log/transaction-receiver
          sudo chmod -R 777 /var/log/transaction-receiver

      - name: Install dependencies
        run: |
          cd transaction-receiver
          npm install

      - name: Run system tests
        run: |
          cd transaction-receiver/tests
          npx vitest run system.test.ts

  build-and-push:
    runs-on: ubuntu-latest
    needs: [integration-tests] # Only run this job if the integration-tests job passes
    # needs: [integration-tests, system-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Store your Docker Hub username in GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # Store your Docker Hub password/token in GitHub Secrets

      - name: Build and push Docker image for transaction-receiver microservice
        run: |
          docker build -t pesekt1/transaction-receiver:latest ./transaction-receiver
          docker push pesekt1/transaction-receiver:latest
